name: Validación ProcessOne (sin despliegue)
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.hostinger.config.ts'
      - '.github/workflows/validate-processone.yml'
      - '.github/workflows/deploy-processone.yml'
      - '.github/workflows/rollback-processone.yml'
      - '.github/workflows/diagnose-processone-ssh.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc -b
      - name: Pruebas automatizadas
        run: pnpm exec vitest run
      - name: Compilar paquete de prueba
        run: pnpm exec vite build --config vite.hostinger.config.ts
      - name: Validar sintaxis PHP
        run: |
          php -l server/api/index.php
          php -l server/api/cells_v12.php
          php -l server/api/setup.php
      - name: Validar scripts de despliegue
        run: |
          for f in deploy/*.sh deploy/remote/*.sh; do bash -n "$f"; done
          shellcheck -S error deploy/*.sh deploy/remote/*.sh
      - name: Armar y verificar paquete (exclusiones y secretos)
        run: bash deploy/build-package.sh "validacion-${GITHUB_RUN_NUMBER}"
      - name: Guardar compilación para revisión (no publicar)
        uses: actions/upload-artifact@v4
        with:
          name: processone-preview-sin-publicar
          path: dist-hostinger/
          retention-days: 7
