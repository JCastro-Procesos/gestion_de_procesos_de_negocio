name: ProcessOne - validar paquete para Hostinger

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'server/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.hostinger.config.ts'
      - '.github/workflows/deploy-hostinger.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run
      - run: pnpm exec vite build --config vite.hostinger.config.ts
      - run: php -l server/api/index.php
      - name: Preparar paquete sin secretos
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-hostinger/index.html
          test -s server/api/index.php
          mkdir -p dist-hostinger/api
          cp server/api/index.php dist-hostinger/api/index.php
          cat > dist-hostinger/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF
          for forbidden in dist-hostinger/api/setup.php dist-hostinger/config.php dist-hostinger/.env; do
            test ! -e "$forbidden" || { echo "::error::Archivo prohibido: $forbidden"; exit 1; }
          done
          (cd dist-hostinger && zip -r ../processone-hostinger.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: processone-hostinger-candidato
          path: processone-hostinger.zip
          retention-days: 14
