name: Mantenimiento ProcessOne (con aprobación)

# Tareas de mantenimiento de producción. Requieren aprobación del entorno processone-production.
#  - permisos-config: config.php a 600, con verificación y restauración automática si falla.
#  - retirar-duplicado: mueve public_html/public_html/procesos a ~/processone-backups (no borra).
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: 'Tarea'
        type: choice
        options: [permisos-config, retirar-duplicado]
        default: permisos-config

permissions:
  contents: read

concurrency:
  group: processone-deploy-produccion
  cancel-in-progress: false

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    environment: processone-production
    steps:
      - uses: actions/checkout@v5
      - name: Preparar conexión SSH verificada
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ vars.HOSTINGER_HOST }}
          PORT: ${{ vars.HOSTINGER_PORT }}
          USER_SSH: ${{ vars.HOSTINGER_USER }}
          FP: ${{ vars.HOSTINGER_HOST_FINGERPRINT }}
        run: bash deploy/ssh-setup.sh
      - name: Restringir config.php a 600 (con verificación)
        if: inputs.tarea == 'permisos-config' || inputs.tarea == ''
        run: |
          cat deploy/remote/common.sh deploy/remote/harden-config.sh | ssh hostinger bash -s -- "${{ vars.PROCESSONE_SITE_URL }}"
      - name: Mover copia duplicada a respaldos (sin borrar)
        if: inputs.tarea == 'retirar-duplicado'
        env:
          DEPLOY_PATH: ${{ vars.HOSTINGER_DEPLOY_PATH }}
        run: |
          cat deploy/remote/common.sh deploy/remote/quarantine-duplicate.sh | ssh hostinger bash -s -- "$DEPLOY_PATH"
      - name: Verificar que producción sigue funcionando
        run: bash deploy/smoke-test.sh "${{ vars.PROCESSONE_SITE_URL }}"
      - name: Verificar que la copia ya no es pública
        if: inputs.tarea == 'retirar-duplicado'
        run: |
          body="$(curl -sS -m 20 "https://viajescasal.com/public_html/procesos/?nc=$(date +%s)" || true)"
          if echo "$body" | grep -q 'ProcessOne'; then echo "::error::La copia sigue respondiendo"; exit 1; fi
          echo "✅ https://viajescasal.com/public_html/procesos/ ya no muestra ProcessOne"
      - name: Limpiar clave
        if: always()
        run: rm -rf ~/.ssh
